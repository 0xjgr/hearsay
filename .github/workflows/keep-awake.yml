# note: render's free plan sleeps after 15 idle minutes; judging runs until dec 21
name: keep-awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: ping the hosted demo
        run: |
          if [ "$(date -u +%Y%m%d)" -gt 20261222 ]; then echo "[keep-awake] judging is over"; exit 0; fi
          curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://hearsay-bench.onrender.com/api/mode
