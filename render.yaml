# note: the judges server and the bench audit; neither holds paypal credentials or a model
services:
  - type: web
    name: hearsay-bench
    runtime: node
    plan: starter
    buildCommand: npx -y pnpm@12.16.1 install --frozen-lockfile && npx -y pnpm@12.16.1 build
    startCommand: node bench/serve-judges.ts
    healthCheckPath: /api/mode
    autoDeployTrigger: commit
    envVars:
      - key: JUDGES_HOST
        value: 0.0.0.0

  # note: re-judges the whole bench in parallel task runs; no model, no paypal, cents per run
  - type: workflow
    name: hearsay-audit
    runtime: node
    region: oregon
    buildCommand: npx -y pnpm@12.16.1 install --frozen-lockfile --prod
    startCommand: node bench/render-audit.ts
